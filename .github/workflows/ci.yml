name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Not ubuntu-latest: that is Ubuntu 26.04, for which setup-python has no
    # Python 3.9 build, and pyproject.toml still supports 3.9.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,web,qr,claude]"
      - run: python -m ruff check .
      - run: python -m mypy okline
      - run: python -m pytest
